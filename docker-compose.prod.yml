# ============================================================
# docker-compose.prod.yml — PRODUCTION
# ============================================================
# Full production stack:
#   - Django via Gunicorn (non-root, hardened)
#   - PostgreSQL 16 with health-check dependency
#   - Nginx as a reverse proxy + static/media file server
#
# Usage (requires .env.prod with production values):
#   docker-compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ── Django / Gunicorn ──────────────────────────────────────
  web:
    build:
      context: .
      target: production         # Uses the hardened 'production' stage
    image: traveltour-backend:prod
    container_name: traveltour_web
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENV=production
    networks:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: traveltour_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traveltour}
      POSTGRES_USER: ${POSTGRES_USER:-traveltour_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traveltour_user} -d ${POSTGRES_DB:-traveltour}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: traveltour_nginx
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    ports:
      - "80:80"
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Networks ───────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true               # DB unreachable from outside

# ── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
