# ============================================================
# docker-compose.prod.yml — PRODUCTION
# ============================================================
# Full production stack:
#   - Django via Gunicorn (non-root, hardened)
#   - PostgreSQL 16 with health-check dependency
#   - Nginx as a reverse proxy + static/media file server
#
# Usage (requires .env.prod with production values):
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# Staging on the same host: a separate checkout, its own project name and a
# `.env` beside this file (read by compose for the ${...} values below):
#   STACK=traveltour_staging  IMAGE_TAG=staging  NGINX_PORT=8013
#   ENV_FILE=.env.staging     POSTGRES_PASSWORD=...
#   docker compose -p azura-staging -f docker-compose.prod.yml up -d --build
# Defaults are the production values, so production is unchanged.
# ============================================================

services:

  # ── Django / Gunicorn ──────────────────────────────────────
  web:
    build:
      context: .
      target: production         # Uses the hardened 'production' stage
    image: traveltour-backend:${IMAGE_TAG:-prod}
    container_name: ${STACK:-traveltour}_web
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - DJANGO_ENV=production
    networks:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ${STACK:-traveltour}_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traveltour}
      POSTGRES_USER: ${POSTGRES_USER:-traveltour_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traveltour_user} -d ${POSTGRES_DB:-traveltour}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ${STACK:-traveltour}_nginx
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    ports:
      # Bound to loopback only — the host nginx (shared reverse proxy on :80/:443)
      # fronts this container and routes azuratravelsbackend.cc → 127.0.0.1:8012.
      # This mirrors the other apps on this box (e.g. enqoreaccessbe-nginx → :8011),
      # so it never fights the host nginx for port 80.
      - "127.0.0.1:${NGINX_PORT:-8012}:80"
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Networks ───────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true               # DB unreachable from outside

# ── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
