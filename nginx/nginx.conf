# ============================================================
# nginx/nginx.conf — Reverse proxy for Travel & Tour backend
# ============================================================
# Serves:
#   /static/   → Django static files (served directly by Nginx)
#   /media/    → User-uploaded media files (served directly)
#   /          → Everything else proxied to Gunicorn
# ============================================================

upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # Replace with your domain in production

    # ── Security headers ──────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "same-origin"    always;

    # ── Static files ──────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ───────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Django API / admin ────────────────────────────────
    location / {
        proxy_pass          http://django;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Timeouts matching Gunicorn worker timeout (120s)
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;

        # Upload size limit (adjust to match your media requirements)
        client_max_body_size 20M;
    }
}
